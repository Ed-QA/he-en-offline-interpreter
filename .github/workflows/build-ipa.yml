name: Build unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare offline translation model (download → ONNX → int8)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "optimum[exporters]<2" torch onnx onnxruntime transformers sentencepiece sacremoses
          python Tools/prepare_model.py
      - name: Show model files
        run: |
          if [ -d Model ]; then ls -lh Model; else echo "Model/ MISSING"; exit 1; fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HEENInterpreter.xcodeproj -scheme HEENInterpreter \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 60
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HEENInterpreter.app Payload/
          zip -qry HEENInterpreter.ipa Payload
          ls -lh HEENInterpreter.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEENInterpreter-ipa
          path: HEENInterpreter.ipa
      - name: Publish release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: HEENInterpreter.ipa
