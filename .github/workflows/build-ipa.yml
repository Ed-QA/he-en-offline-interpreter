name: Build unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project HEENInterpreter.xcodeproj -scheme HEENInterpreter \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HEENInterpreter.app Payload/
          zip -qry HEENInterpreter.ipa Payload
          ls -lh HEENInterpreter.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEENInterpreter-ipa
          path: HEENInterpreter.ipa
      - name: Publish release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: HEENInterpreter.ipa
