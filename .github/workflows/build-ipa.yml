name: Build unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare offline translation model (download → ONNX → int8)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "optimum[exporters]==1.24.0" "transformers==4.46.3" "torch==2.5.1" "onnx==1.17.0" "onnxruntime==1.20.1" "sentencepiece==0.2.0" "sacremoses==0.1.1"
          python Tools/prepare_model.py
      - name: Show model files
        run: |
          if [ -d Model ]; then ls -lh Model; else echo "Model/ MISSING"; exit 1; fi
      - name: Prepare Hebrew ASR with nikud (Whisper-Nikudon, int8)
        # The recognizer that emits pointed Hebrew straight from the audio. It is the app's only
        # recognizer: the post-hoc diacritizer was deleted, and so was the streaming zipformer
        # model — nothing downloads or ships a model the app never opens.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "transformers==4.46.3" "torch==2.5.1" "onnx==1.17.0" "onnxruntime==1.20.1" "sentencepiece==0.2.0" sherpa-onnx
          python Tools/prepare_stt_nikud.py
          ls -lh Model/WhisperNikud
      - name: Tokenizer pre-flight (same Swift tokenizer code as the app)
        run: |
          cd Tools/TokenizerCheck
          swift run -c release TokenizerCheck ../../Model
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HEENInterpreter.xcodeproj -scheme HEENInterpreter \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 60
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HEENInterpreter.app Payload/
          zip -qry HEENInterpreter.ipa Payload
          ls -lh HEENInterpreter.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEENInterpreter-ipa
          path: HEENInterpreter.ipa
      - name: Publish release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: HEENInterpreter.ipa
