name: Simulator tests (no device)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  sim-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache prepared models (translation + STT)
        id: model-cache
        uses: actions/cache@v4
        with:
          path: Model
          key: models-${{ hashFiles('Tools/prepare_model.py', 'Tools/prepare_stt.py') }}
      - name: Prepare offline translation model (only on cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "optimum[exporters]==1.24.0" "transformers==4.46.3" "torch==2.5.1" "onnx==1.17.0" "onnxruntime==1.20.1" "sentencepiece==0.2.0" "sacremoses==0.1.1"
          python Tools/prepare_model.py
      - name: Fetch offline STT model (only on cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet huggingface_hub
          python Tools/prepare_stt.py
      - name: Fetch nikud diacritizer + Silero VAD
        # Always runs: an older cache may predate these files, and prepare_nikud.py skips
        # whatever is already there (so a warm cache costs one no-op).
        run: |
          python -m pip install --quiet huggingface_hub
          python Tools/prepare_nikud.py
          ls -l Model/Nikud Model/VAD
      - name: Generate a Hebrew audio fixture with the macOS Hebrew voice
        run: |
          mkdir -p Model
          if say -v '?' | grep -qi carmit; then
            say -v Carmit --file-format=WAVE --data-format=LEI16@16000 \
              -o Model/test-hebrew.wav \
              "שלום, מה שלומך היום? אני רוצה לקנות לחם מחר בבוקר."
            ls -l Model/test-hebrew.wav
          else
            echo "no Hebrew voice on this runner — the STT audio test will be skipped"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          echo "--- available iPhone simulators ---"
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run simulator tests (unit + UI)
        run: |
          set -o pipefail
          xcodebuild test \
            -project HEENInterpreter.xcodeproj \
            -scheme HEENInterpreter \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tail -n 400
      - name: Switch the simulator to dark appearance and large text
        run: |
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance dark
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" content_size accessibility-extra-large \
            || echo "content_size is not supported by this simctl build"
      - name: UI screenshots in dark mode and large text
        # Same UI tests, second result bundle: proves the screens survive dark mode and
        # Dynamic Type instead of relying on the light-mode shots alone.
        run: |
          set -o pipefail
          xcodebuild test \
            -project HEENInterpreter.xcodeproj \
            -scheme HEENInterpreter \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HEENInterpreterUITests \
            -resultBundlePath TestResultsDark.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 420 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tail -n 200
      - name: Print failing tests (best effort)
        if: failure()
        run: |
          for b in TestResults TestResultsDark; do
            echo "--- $b ---"
            xcrun xcresulttool get test-results summary --path "$b.xcresult" 2>/dev/null | head -c 3000 \
              || echo "not readable"
          done
      - name: Export the screenshots from the result bundles
        if: always()
        run: |
          mkdir -p shots
          for b in TestResults TestResultsDark; do
            if [ -d "$b.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$b.xcresult" --output-path "shots/$b" \
                || echo "attachment export failed for $b"
            fi
          done
          python3 Tools/export_shots.py
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: |
            TestResults.xcresult
            TestResultsDark.xcresult
            shots/out
          if-no-files-found: warn
