name: HEENInterpreter
options:
  bundleIdPrefix: com.shedw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.19.2
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  HEENInterpreter:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Model
        type: folder
    dependencies:
      - package: onnxruntime
        product: onnxruntime
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shedw.he2en
        PRODUCT_NAME: HEENInterpreter
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: HE-EN Offline
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone hears Hebrew speech; recognition is on-device only."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "On-device Hebrew speech recognition. No audio leaves this phone."
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
