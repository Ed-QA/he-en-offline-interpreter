name: HEENInterpreter
options:
  bundleIdPrefix: com.shedw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # ONNX Runtime comes from the same prebuilt package sherpa-onnx pins, so the app
  # links exactly one onnxruntime.framework (two providers = "Multiple commands
  # produce .../onnxruntime.framework"). Sources/ORT.swift talks to its C API.
  onnxruntime-libs:
    url: https://github.com/csukuangfj/onnxruntime-libs
    exactVersion: 1.28.2
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_TESTABILITY: YES
schemes:
  HEENInterpreter:
    build:
      targets:
        HEENInterpreter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HEENInterpreterTests
        - HEENInterpreterUITests
targets:
  HEENInterpreter:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Model
        type: folder
    dependencies:
      - package: onnxruntime-libs
        product: onnxruntime-ios-shared
      - package: swift-transformers
        product: Tokenizers
      - package: sherpa-onnx
        product: sherpa-onnx-shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shedw.he2en
        PRODUCT_NAME: HEENInterpreter
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_CFBundleDisplayName: HE-EN Offline
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone hears Hebrew speech; recognition is on-device only."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "On-device Hebrew speech recognition. No audio leaves this phone."
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
  HEENInterpreterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HEENInterpreter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shedw.he2en.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  HEENInterpreterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HEENInterpreter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shedw.he2en.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HEENInterpreter
        SWIFT_STRICT_CONCURRENCY: minimal
